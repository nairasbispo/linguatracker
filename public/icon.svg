<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#192A22"/>
      <stop offset="45%" stop-color="#143D2D"/>
      <stop offset="100%" stop-color="#0E241A"/>
    </linearGradient>
    
    <!-- Outer Glow / Rim -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Sprout Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="60%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Right Leaf Gradient -->
    <linearGradient id="leafRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Book Page Gradient Left -->
    <linearGradient id="pageLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EFE8D8"/>
      <stop offset="85%" stop-color="#FAF7F0"/>
      <stop offset="100%" stop-color="#DCD4C0"/>
    </linearGradient>

    <!-- Book Page Gradient Right -->
    <linearGradient id="pageRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DCD4C0"/>
      <stop offset="15%" stop-color="#FAF7F0"/>
      <stop offset="100%" stop-color="#EFE8D8"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Subtle Glow -->
    <filter id="sproutGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle (App Icon Profile) -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGrad)"/>
  <rect x="18" y="18" width="476" height="476" rx="110" ry="110" fill="none" stroke="url(#rimGrad)" stroke-width="4" opacity="0.6"/>

  <!-- Subtle Ambient Radial Spotlight behind Book -->
  <circle cx="256" cy="270" r="160" fill="#1E5E44" opacity="0.5"/>

  <!-- Main Illustration Group -->
  <g filter="url(#softShadow)">
    <!-- Book Base / Cover (Deep Brown-Gold / Leather Accent) -->
    <path d="M 104,330 C 140,344 200,348 256,354 C 312,348 372,344 408,330 C 418,326 426,334 426,344 C 426,358 374,382 256,386 C 138,382 86,358 86,344 C 86,334 94,326 104,330 Z" fill="#201C16" opacity="0.6"/>

    <!-- Left Book Page -->
    <path d="M 120,240 C 165,224 215,228 254,242 L 254,342 C 215,328 165,324 120,340 C 112,343 104,337 104,328 L 104,252 C 104,243 112,237 120,240 Z" fill="url(#pageLeft)"/>

    <!-- Right Book Page -->
    <path d="M 258,242 C 297,228 347,224 392,240 C 400,237 408,243 408,252 L 408,328 C 408,337 400,343 392,340 C 347,324 297,328 258,342 Z" fill="url(#pageRight)"/>

    <!-- Subtle Book Page Text Lines (Left) -->
    <path d="M 136,264 C 168,254 204,256 230,265" stroke="#C4B9A2" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M 136,284 C 168,274 204,276 230,285" stroke="#C4B9A2" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M 136,304 C 168,294 204,296 230,305" stroke="#C4B9A2" stroke-width="4.5" stroke-linecap="round" fill="none"/>

    <!-- Subtle Book Page Text Lines (Right) -->
    <path d="M 282,265 C 308,256 344,254 376,264" stroke="#C4B9A2" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M 282,285 C 308,276 344,274 376,284" stroke="#C4B9A2" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M 282,305 C 308,296 344,294 376,304" stroke="#C4B9A2" stroke-width="4.5" stroke-linecap="round" fill="none"/>

    <!-- Center Book Spine Shadow -->
    <line x1="256" y1="242" x2="256" y2="344" stroke="#9A8F78" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Growing Sprout / Plant springing from book -->
  <g filter="url(#sproutGlow)">
    <!-- Main Stem -->
    <path d="M 256,265 C 256,220 252,185 248,155" stroke="#10B981" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M 256,265 C 256,220 252,185 248,155" stroke="#6EE7B7" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Left Sprout Leaf (Organic & Plump) -->
    <path d="M 252,205 C 215,200 178,168 184,136 C 216,134 246,168 252,195 Z" fill="url(#leafGrad)"/>
    <!-- Left Leaf Highlight Vein -->
    <path d="M 250,196 C 232,180 210,160 196,145" stroke="#A7F3D0" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.8"/>

    <!-- Right Sprout Leaf (Cute, angled upward) -->
    <path d="M 250,172 C 285,160 326,128 322,96 C 290,96 258,132 250,162 Z" fill="url(#leafRightGrad)"/>
    <!-- Right Leaf Highlight Vein -->
    <path d="M 252,163 C 272,142 296,120 310,106" stroke="#D1FAE5" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.9"/>
  </g>

  <!-- Speech / Sound Waves (Language audio & conversation symbol) -->
  <g fill="none" stroke="#FDE047" stroke-linecap="round">
    <!-- Inner Sound Arc -->
    <path d="M 334,188 C 348,198 356,214 356,232 C 356,250 348,266 334,276" stroke-width="6" opacity="0.9"/>
    <!-- Outer Sound Arc -->
    <path d="M 354,172 C 374,188 386,210 386,232 C 386,254 374,276 354,292" stroke-width="6" opacity="0.6"/>
  </g>

  <!-- Phonetic Accent Dot -->
  <circle cx="340" cy="232" r="5" fill="#FDE047"/>

  <!-- Top-Right Motivation Sparkle Star -->
  <g transform="translate(372, 100)">
    <path d="M 0,-18 C 0,-7 7,0 18,0 C 7,0 0,7 0,18 C 0,7 -7,0 -18,0 C -7,0 0,-7 0,-18 Z" fill="#FDE047"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Secondary Mini Star -->
  <g transform="translate(138, 160) scale(0.6)">
    <path d="M 0,-18 C 0,-7 7,0 18,0 C 7,0 0,7 0,18 C 0,7 -7,0 -18,0 C -7,0 0,-7 0,-18 Z" fill="#6EE7B7" opacity="0.85"/>
  </g>
</svg>
